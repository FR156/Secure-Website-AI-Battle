<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optional: Custom font */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Create Your Account</h2>
        <form action="process_register.php" method="POST">
            <div class="mb-5">
                <label for="username" class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       required autocomplete="username">
            </div>
            <div class="mb-5">
                <label for="email" class="block text-gray-700 text-sm font-semibold mb-2">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       required autocomplete="email">
            </div>
            <div class="mb-5">
                <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       required autocomplete="new-password">
            </div>
            <div class="mb-6">
                <label for="confirm_password" class="block text-gray-700 text-sm font-semibold mb-2">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       required autocomplete="new-password">
            </div>
            <button type="submit"
                    class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                Register
            </button>
        </form>
        <p class="text-center text-gray-600 mt-6">
            Already have an account? <a href="login.html" class="text-blue-600 hover:underline">Login here</a>.
        </p>
        <div id="message" class="mt-4 text-center text-sm font-medium">
            <!-- Messages from backend (e.g., registration success/failure) will be displayed here -->
        </div>
    </div>

    <script>
        // Check for session messages and display them
        document.addEventListener('DOMContentLoaded', function() {
            const messageDiv = document.getElementById('message');
            if (messageDiv) {
                // Use a simple fetch to a temporary PHP script that echoes session message
                // In a real app, you might use AJAX to get messages or embed them directly if PHP rendered the HTML
                fetch('get_session_message.php')
                    .then(response => response.json())
                    .then(data => {
                        if (data.message) {
                            messageDiv.innerHTML = data.message;
                            if (data.type === 'success') {
                                messageDiv.classList.add('text-green-600');
                            } else if (data.type === 'error') {
                                messageDiv.classList.add('text-red-600');
                            } else if (data.type === 'info') {
                                messageDiv.classList.add('text-blue-600');
                            }
                            // Clear the message after displaying it once
                            fetch('clear_session_message.php');
                        }
                    })
                    .catch(error => console.error('Error fetching session message:', error));
            }
        });
    </script>
</body>
</html>
